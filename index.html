<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อกสินค้า (HQ Full System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', }</script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-[#121212] dark:text-gray-200 transition-colors duration-300">

    <div id="login-page" class="min-h-screen flex items-center justify-center bg-gray-900 dark:bg-black">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg w-96">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">เข้าสู่ระบบสต็อก</h2>
                <p class="text-sm text-gray-500">📍 Chonburi HQ</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="username" class="mt-1 block w-full border rounded-md py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-blue-500" placeholder="admin">
                <input type="password" id="password" class="mt-1 block w-full border rounded-md py-2 px-3 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                <button onclick="login()" class="w-full py-2 px-4 rounded-md text-white bg-blue-600 hover:bg-blue-700 font-bold transition">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <div id="dashboard-page" class="hidden flex h-screen overflow-hidden">
        <div class="w-64 bg-gray-800 dark:bg-[#1e1e1e] border-r border-gray-700 dark:border-gray-800 text-white flex flex-col z-20">
            <div class="h-16 flex items-center px-4 font-bold text-xl border-b border-gray-700">
                Stock Manager
                <div class="text-xs font-normal text-green-400 block w-full mt-1">📍 ออฟฟิศชลบุรี HQ</div>
            </div>
            <nav class="flex-1 px-2 py-4 space-y-1 overflow-y-auto">
                <button onclick="switchTab('overview-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md bg-gray-900 border-l-4 border-blue-500">📈 แดชบอร์ด (Dashboard)</button>
                <button onclick="switchTab('master-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">⚙️ สร้างสินค้า & ลูกค้า</button>
                <button onclick="switchTab('stock-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">📋 สินค้าคงคลังทั้งหมด</button>
                <button onclick="switchTab('inbound-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">📦 รับเข้าสินค้า (Inbound)</button>
                <button onclick="switchTab('outbound-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">📤 โอน/ขาย (Transfer)</button>
                <button onclick="switchTab('maintenance-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">🔧 แจ้งซ่อม / Turn</button>
                <button onclick="switchTab('report-tab', this)" class="nav-btn w-full text-left text-gray-300 hover:bg-gray-700 flex items-center px-2 py-2 text-sm font-medium rounded-md">📊 Report เคลื่อนไหว</button>
            </nav>
        </div>

        <div class="flex-1 flex flex-col bg-gray-50 dark:bg-[#121212]">
            <header class="h-16 bg-white dark:bg-[#1e1e1e] border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 shadow-sm z-10">
                <span class="bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 px-3 py-1 rounded-full text-sm font-bold border border-blue-200 dark:border-blue-800">📍 โลเคชั่นออฟฟิศชลบุรี HQ</span>
                <div class="flex items-center space-x-4">
                    <span id="display-user" class="text-sm font-medium"></span>
                    <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">🌙</button>
                    <button onclick="logout()" class="text-sm bg-red-100 text-red-600 px-3 py-1 rounded font-medium hover:bg-red-200 transition">Logout</button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6 relative">
                <div id="overview-tab" class="tab-content max-w-6xl mx-auto space-y-6">
                    <h1 class="text-2xl font-bold">📈 แดชบอร์ดภาพรวม</h1>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800 text-center">
                            <span class="text-xs text-gray-500 uppercase font-bold">ทั้งหมด</span>
                            <div id="dash-total" class="text-4xl font-bold text-blue-600 mt-2">0</div>
                        </div>
                        <div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800 text-center">
                            <span class="text-xs text-gray-500 uppercase font-bold">พร้อมใช้งาน</span>
                            <div id="dash-avail" class="text-4xl font-bold text-green-500 mt-2">0</div>
                        </div>
                        <div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800 text-center">
                            <span class="text-xs text-gray-500 uppercase font-bold">ขาย/โอนออก</span>
                            <div id="dash-sold" class="text-4xl font-bold text-gray-500 mt-2">0</div>
                        </div>
                        <div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800 text-center">
                            <span class="text-xs text-gray-500 uppercase font-bold">แจ้งซ่อม</span>
                            <div id="dash-repair" class="text-4xl font-bold text-orange-500 mt-2">0</div>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800">
                        <h2 class="text-lg font-bold mb-4">ตารางสรุปจำนวนสต็อกปัจจุบัน</h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-100 dark:bg-gray-800">
                                    <tr>
                                        <th class="p-3">หมวดหมู่</th>
                                        <th class="p-3 text-center">พร้อมใช้</th>
                                        <th class="p-3 text-center">ขาย/โอน</th>
                                        <th class="p-3 text-center">ส่งซ่อม</th>
                                        <th class="p-3 text-center">รวม</th>
                                    </tr>
                                </thead>
                                <tbody id="summaryTableBody" class="divide-y dark:divide-gray-700"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                </main>
        </div>
    </div>

    <script>
        let stockData = [...]; // (ข้อมูลสต็อกเดิมของคุณ)
        let transactions = [];

        function renderDashboard() {
            // คำนวณสรุป
            const avail = stockData.filter(i => i.status === 'Available').length;
            const sold = stockData.filter(i => i.status === 'Sold').length;
            const repair = stockData.filter(i => i.status === 'Repair').length;
            
            document.getElementById('dash-total').innerText = stockData.length;
            document.getElementById('dash-avail').innerText = avail;
            document.getElementById('dash-sold').innerText = sold;
            document.getElementById('dash-repair').innerText = repair;

            renderSummaryTable();
        }

        function renderSummaryTable() {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            const categories = [...new Set(stockData.map(i => i.category))];
            let tAvail = 0, tSold = 0, tRepair = 0, tGrand = 0;

            categories.forEach(cat => {
                const items = stockData.filter(i => i.category === cat);
                const a = items.filter(i => i.status === 'Available').length;
                const s = items.filter(i => i.status === 'Sold').length;
                const r = items.filter(i => i.status === 'Repair').length;
                tAvail += a; tSold += s; tRepair += r; tGrand += items.length;

                tbody.innerHTML += `<tr>
                    <td class="p-3 font-bold text-blue-600">${cat}</td>
                    <td class="p-3 text-center">${a}</td>
                    <td class="p-3 text-center">${s}</td>
                    <td class="p-3 text-center">${r}</td>
                    <td class="p-3 text-center font-bold">${items.length}</td>
                </tr>`;
            });

            tbody.innerHTML += `
                <tr class="bg-gray-100 dark:bg-gray-900 font-bold border-t-2">
                    <td class="p-3 text-right">รวมทั้งหมด</td>
                    <td class="p-3 text-center text-green-600">${tAvail}</td>
                    <td class="p-3 text-center text-gray-500">${tSold}</td>
                    <td class="p-3 text-center text-orange-500">${tRepair}</td>
                    <td class="p-3 text-center text-blue-600 text-lg">${tGrand}</td>
                </tr>`;
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            if(tabId === 'overview-tab') renderDashboard();
        }

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
        function login() { document.getElementById('login-page').classList.add('hidden'); document.getElementById('dashboard-page').classList.remove('hidden'); renderDashboard(); }
        function logout() { location.reload(); }
    </script>
</body>
</html>
